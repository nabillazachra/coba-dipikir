name: Episode 007 Acting Proof QA (No MP4)
on:
  push:
    branches:
      - feature/e007-lift-signal-acting-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acting-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --quiet Pillow==11.3.0
      - name: Static verification
        run: |
          npx tsc --noEmit
          python - <<'PY'
          from pathlib import Path
          proof=Path('src/projects/007-sinyal-lift/ActingProof.tsx').read_text()
          root=Path('src/Root.tsx').read_text()
          assert "from '../002-kulkas/Character'" in proof
          assert "durationInFrames={240}" in root
          assert "E007-Lift-Signal-Acting-Proof-QA" in root
          assert 'playbackRate' not in proof
          assert not Path('src/projects/007-sinyal-lift/Film.tsx').exists()
          assert not Path('src/projects/007-sinyal-lift/Composition.tsx').exists()
          print('E007 Gate B: isolated proof, correct master character and QA composition')
          PY
      - name: Generate representative full-resolution still frames (NO MP4)
        run: |
          mkdir -p /tmp/e007
          for frame in 0 15 30 45 60 75 90 105 120 135 150 165 180 195 210 225 239; do
            npx remotion still E007-Lift-Signal-Acting-Proof /tmp/e007/scene-$frame.png --frame=$frame --log=error
          done
          for frame in 0 45 90 135 150 180 210 239; do
            npx remotion still E007-Lift-Signal-Acting-Proof-QA /tmp/e007/safe-$frame.png --frame=$frame --log=error
          done
      - name: Generate contact sheet and low-res looping WebP (NO MP4)
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          d=Path('/tmp/e007')
          marks=[0,15,30,45,60,75,90,105,120,135,150,165,180,195,210,225,239]
          w,h=216,384
          sheet=Image.new('RGB',(4*(w+12)+12,5*(h+29)+10),'#f6f0e5')
          draw=ImageDraw.Draw(sheet)
          for i,frame in enumerate(marks):
            im=Image.open(d/f'scene-{frame}.png').convert('RGB')
            im.thumbnail((w,h))
            x=12+(i%4)*(w+12)
            y=25+(i//4)*(h+29)
            sheet.paste(im,(x,y))
            draw.text((x,y-17),f'{frame/30:.2f}s',fill='#20251f')
          sheet.save(d/'contact-sheet.webp','WEBP',quality=86)
          PY
          for frame in $(seq 0 5 235); do
            npx remotion still E007-Lift-Signal-Acting-Proof /tmp/e007/anim-$frame.png --frame=$frame --log=error
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('/tmp/e007')
          frames=[]
          for frame in range(0,240,5):
            im=Image.open(d/f'anim-{frame}.png').convert('RGB')
            im.thumbnail((270,480))
            frames.append(im)
          frames[0].save(d/'review-motion-8s.webp',format='WEBP',save_all=True,
             append_images=frames[1:],duration=167,loop=0,quality=72,method=4)
          print('Contact sheet and WebP loop generated; nothing exported as MP4')
          PY
      - name: Upload creative review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e007-gate-b-acting-proof-no-mp4
          path: /tmp/e007
          retention-days: 10
