name: Render Remotion MP4

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition ID
        required: true
        default: E001-Gratis-Ongkir
        type: string
      output_name:
        description: Output filename without .mp4
        required: true
        default: 001-gratis-ongkir
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render MP4
        run: >-
          npx remotion render src/index.ts
          "${{ inputs.composition }}"
          "renders/${{ inputs.output_name }}.mp4"
          --codec=h264

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: renders/${{ inputs.output_name }}.mp4
          if-no-files-found: error
          retention-days: 30
