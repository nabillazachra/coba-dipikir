name: Episode 004 Visual QA (feature branch)
on:
  push:
    branches:
      - feat/episode-004-lift-close
      - feat/e004-cinematic-rework
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements-voice.txt mutagen==1.47.0 imageio-ffmpeg==0.6.0 Pillow
      - name: Build episode 004 assets
        run: |
          node scripts/generate-voiceover.mjs --project=004-lift-close
          npm run audio:ep4-sfx
          python scripts/measure-episode4-voice.py
      - name: Verify TypeScript and CMS
        run: |
          npx tsc --noEmit
          npm run cms:build
      - name: Storyboard stills
        run: |
          mkdir -p /tmp/e004
          for frame in 16 44 167 275 348 477 609 684 779 929 1067 1240 1452 1614 1746 1905 2043 2244 2328 2352 2394; do
            npx remotion still E004-Close-Lift /tmp/e004/e004-${frame}.png --frame=${frame} --log=error
          done
          python - <<'PY'
          import base64,io
          from PIL import Image,ImageDraw
          frames=[16,44,167,275,348,477,609,684,779,929,1067,1240,1452,1614,1746,1905,2043,2244,2328,2352,2394]
          W,H=235,418
          sheet=Image.new('RGB',(3*(W+12)+14,7*(H+30)+14),'#f6f0e5')
          d=ImageDraw.Draw(sheet)
          for i,n in enumerate(frames):
              im=Image.open(f'/tmp/e004/e004-{n}.png').convert('RGB')
              im.thumbnail((W,H))
              x=14+(i%3)*(W+12)
              y=26+(i//3)*(H+30)
              sheet.paste(im,(x,y))
              d.text((x,y-19),f'SCENE {i+1} @ {n/30:.1f}s',fill='#20251f')
          out=io.BytesIO()
          sheet.save(out,format='WEBP',quality=51,method=6)
          print('E004_QA_BEGIN')
          print(base64.b64encode(out.getvalue()).decode('ascii'))
          print('E004_QA_END')
          PY
      - name: Action sequencing QA - door slide, sensor and button beats
        run: |
          for frame in 399 432 466 492 663 678 695 710 1338 1366 1400 1449 2255 2307 2347 2373; do
            npx remotion still E004-Close-Lift /tmp/e004/e004-action-${frame}.png --frame=${frame} --log=error
          done
          python - <<'PY'
          import base64,io
          from PIL import Image,ImageDraw
          frames=[399,432,466,492,663,678,695,710,1338,1366,1400,1449,2255,2307,2347,2373]
          w,h=235,418
          sheet=Image.new('RGB',(4*(w+12)+12,4*(h+31)+12),'#f6f0e5')
          d=ImageDraw.Draw(sheet)
          for i,n in enumerate(frames):
              im=Image.open(f'/tmp/e004/e004-action-{n}.png').convert('RGB')
              im.thumbnail((w,h))
              x=12+(i%4)*(w+12);y=27+(i//4)*(h+31)
              sheet.paste(im,(x,y))
              d.text((x,y-18),f'{n/30:.2f}s',fill='#20251f')
          out=io.BytesIO()
          sheet.save(out,format='WEBP',quality=52,method=6)
          print('E004_MOTION_QA_BEGIN')
          print(base64.b64encode(out.getvalue()).decode('ascii'))
          print('E004_MOTION_QA_END')
          PY
      - name: Upload storyboard frames
        uses: actions/upload-artifact@v4
        with:
          name: episode004-qa-contact
          path: /tmp/e004
          retention-days: 7
