name: Deploy CMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_EMAIL: ${{ secrets.CMS_EMAIL }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Restore generated voiceover cache
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: public/audio
          key: ${{ runner.os }}-voice-${{ hashFiles('src/projects/**/voiceover.config.ts', 'requirements-voice.txt') }}

      - name: Install Edge TTS
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements-voice.txt

      - name: Generate voiceover
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: npm run voice:generate

      - name: Generate sound bed
        run: npm run audio:bed

      - name: Generate episode 2 SFX
        run: npm run audio:ep2-sfx

      - name: Generate CMS auth verifier
        if: ${{ env.CMS_EMAIL != '' && env.CMS_PASSWORD != '' }}
        run: node scripts/generate-auth-env.mjs

      - name: Build CMS
        run: npm run cms:build

      - name: QA critical episode 2 frames
        run: |
          python -m pip install --quiet Pillow
          for frame in 60 300 510 780 960 1050 1260 1320 1500; do
            npx remotion still E002-Kenapa-Buka-Kulkas /tmp/ep2-${frame}.png --frame=${frame}
          done
          python - <<'PY'
          import base64, io
          from PIL import Image, ImageDraw
          frames = [60,300,510,780,960,1050,1260,1320,1500]
          board = Image.new('RGB',(810,1296),'#f6f0e5')
          draw = ImageDraw.Draw(board)
          for i,n in enumerate(frames):
              im=Image.open(f'/tmp/ep2-{n}.png').convert('RGB')
              im=im.resize((250,444))
              x=(i%3)*270+10
              y=(i//3)*432
              board.paste(im.crop((0,0,250,415)),(x,y+17))
              draw.text((x+5,y+2),f'FRAME {n}',fill='#20251f')
          out=io.BytesIO()
          board.save(out,format='WEBP',quality=42,method=6)
          print('EP2_CONTACT_BEGIN')
          print(base64.b64encode(out.getvalue()).decode('ascii'))
          print('EP2_CONTACT_END')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cms

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
