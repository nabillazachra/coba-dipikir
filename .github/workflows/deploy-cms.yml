name: Deploy CMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_EMAIL: ${{ secrets.CMS_EMAIL }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Restore generated voiceover cache
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: public/audio
          key: ${{ runner.os }}-voice-${{ hashFiles('src/projects/**/voiceover.config.ts', 'requirements-voice.txt') }}

      - name: Install Edge TTS
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements-voice.txt

      - name: Generate voiceover
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: npm run voice:generate

      - name: Generate sound bed
        run: npm run audio:bed

      - name: Generate episode 2 SFX
        run: npm run audio:ep2-sfx

      - name: Generate CMS auth verifier
        if: ${{ env.CMS_EMAIL != '' && env.CMS_PASSWORD != '' }}
        run: node scripts/generate-auth-env.mjs

      - name: Build CMS
        run: npm run cms:build

      - name: QA episode 002 rendered frames
        continue-on-error: true
        run: |
          for frame in 60 300 1050; do
            npx remotion still E002-Kenapa-Buka-Kulkas /tmp/ep2-qa-${frame}.png --frame=${frame}
            ffmpeg -y -loglevel error -i /tmp/ep2-qa-${frame}.png -vf scale=405:-2 -c:v libwebp -quality 52 /tmp/ep2-qa-${frame}.webp
            echo "EP2_QA_FRAME_${frame}_BEGIN"
            base64 -w0 /tmp/ep2-qa-${frame}.webp
            echo
            echo "EP2_QA_FRAME_${frame}_END"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cms

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
