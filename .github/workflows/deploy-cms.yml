name: Deploy CMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_EMAIL: ${{ secrets.CMS_EMAIL }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Restore generated voiceover cache
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: public/audio
          key: ${{ runner.os }}-voice-${{ hashFiles('src/projects/**/voiceover.config.ts', 'requirements-voice.txt') }}
          restore-keys: |
            ${{ runner.os }}-voice-

      # Reuse voice files from checkout/cache, generate only truly missing clips.
      # A new episode must not cause all older clips to be synthesized again.
      - name: Install Edge TTS
        run: pip install -r requirements-voice.txt

      - name: Generate only missing voiceover
        run: node scripts/generate-voiceover.mjs --missing-only

      - name: Generate sound bed
        run: npm run audio:bed

      - name: Generate episode 2 SFX
        run: npm run audio:ep2-sfx

      - name: Generate episode 3 price SFX
        run: npm run audio:ep3-sfx

      - name: Generate episode 4 elevator SFX
        run: npm run audio:ep4-sfx

      - name: Generate episode 5 travel SFX
        run: npm run audio:ep5-sfx

      - name: Measure and synchronize episode 4 voice
        run: |
          python -m pip install --quiet mutagen==1.47.0 imageio-ffmpeg==0.6.0
          python scripts/measure-episode4-voice.py

      - name: Measure and synchronize episode 5 voice
        run: |
          python -m pip install --quiet mutagen==1.47.0
          python scripts/measure-episode5-voice.py

      - name: Measure actual VO and synchronize episode 3 subtitles
        run: |
          python -m pip install --quiet mutagen==1.47.0 imageio-ffmpeg==0.6.0
          python scripts/measure-episode3-voice.py

      - name: Generate CMS auth verifier
        if: ${{ env.CMS_EMAIL != '' && env.CMS_PASSWORD != '' }}
        run: node scripts/generate-auth-env.mjs

      - name: Build CMS
        run: npm run cms:build

      # Cinematic stills are validated by episode-specific QA workflows,
      # not by the release pipeline that publishes the CMS application.
      - name: Verify Episode 006 is in the published CMS bundle
        run: |
          grep -R -q "006-lagu-masa-lalu" dist/cms/assets
          echo "Episode 006 found in compiled CMS bundle"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cms

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
