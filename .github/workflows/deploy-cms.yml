name: Deploy CMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_EMAIL: ${{ secrets.CMS_EMAIL }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Restore generated voiceover cache
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: public/audio
          key: ${{ runner.os }}-voice-${{ hashFiles('src/projects/**/voiceover.config.ts', 'requirements-voice.txt') }}

      - name: Install Edge TTS
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements-voice.txt

      - name: Generate voiceover
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: npm run voice:generate

      - name: Generate sound bed
        run: npm run audio:bed

      - name: Generate episode 2 SFX
        run: npm run audio:ep2-sfx

      - name: Generate episode 3 price SFX
        run: npm run audio:ep3-sfx

      - name: Generate episode 4 elevator SFX
        run: npm run audio:ep4-sfx

      - name: Generate episode 5 travel SFX
        run: npm run audio:ep5-sfx

      - name: Measure and synchronize episode 4 voice
        run: |
          python -m pip install --quiet mutagen==1.47.0 imageio-ffmpeg==0.6.0
          python scripts/measure-episode4-voice.py

      - name: Measure and synchronize episode 5 voice
        run: |
          python -m pip install --quiet mutagen==1.47.0
          python scripts/measure-episode5-voice.py

      - name: Measure actual VO and synchronize episode 3 subtitles
        run: |
          python -m pip install --quiet mutagen==1.47.0 imageio-ffmpeg==0.6.0
          python scripts/measure-episode3-voice.py

      - name: Generate CMS auth verifier
        if: ${{ env.CMS_EMAIL != '' && env.CMS_PASSWORD != '' }}
        run: node scripts/generate-auth-env.mjs

      - name: Build CMS
        run: npm run cms:build

      - name: Visual QA - Episode 3 storyboard contact sheet
        run: |
          python -m pip install --quiet Pillow
          for frame in 53 187 320 468 627 815 1004 1166 1302 1459 1641 1821; do
            npx remotion still E003-Harga-99000 /tmp/e003-${frame}.png --frame=${frame}
          done
          python - <<'PY'
          import base64, io
          from PIL import Image, ImageDraw
          frames = [53,187,320,468,627,815,1004,1166,1302,1459,1641,1821]
          sheet = Image.new('RGB', (1050, 1530), '#f6f0e5')
          draw = ImageDraw.Draw(sheet)
          for i,n in enumerate(frames):
              image = Image.open(f'/tmp/e003-{n}.png').convert('RGB')
              image = image.resize((244,434))
              x = (i%4)*260+14
              y = (i//4)*496+26
              sheet.paste(image,(x,y))
              draw.text((x,y-17),f'SCENE {i+1} @ {n/30:.1f}s',fill='#20251f')
          out = io.BytesIO()
          sheet.save(out,format='WEBP',quality=52,method=6)
          print('E003_QA_BEGIN')
          print(base64.b64encode(out.getvalue()).decode('ascii'))
          print('E003_QA_END')
          PY

      - name: Visual QA - Episode 4 storyboard contact sheet
        run: |
          mkdir -p /tmp/e004
          for frame in 44 167 275 348 477 609 684 779 929 1067 1240 1452 1614 1746 1905 2043 2244 2394; do
            npx remotion still E004-Close-Lift /tmp/e004/e004-${frame}.png --frame=${frame}
          done
          python - <<'PY'
          import base64,io
          from PIL import Image,ImageDraw
          frames=[44,167,275,348,477,609,684,779,929,1067,1240,1452,1614,1746,1905,2043,2244,2394]
          W,H=215,383
          sheet=Image.new('RGB',(3*(W+12)+14,6*(H+30)+14),'#f6f0e5')
          d=ImageDraw.Draw(sheet)
          for i,n in enumerate(frames):
              im=Image.open(f'/tmp/e004/e004-{n}.png').convert('RGB')
              im.thumbnail((W,H))
              x=14+(i%3)*(W+12)
              y=26+(i//3)*(H+30)
              sheet.paste(im,(x,y))
              d.text((x,y-19),f'SCENE {i+1} @ {n/30:.1f}s',fill='#20251f')
          out=io.BytesIO()
          sheet.save(out,format='WEBP',quality=49,method=6)
          print('E004_QA_BEGIN')
          print(base64.b64encode(out.getvalue()).decode('ascii'))
          print('E004_QA_END')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cms

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
