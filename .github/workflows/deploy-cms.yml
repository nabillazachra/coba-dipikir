name: Deploy CMS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_EMAIL: ${{ secrets.CMS_EMAIL }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate CMS auth verifier
        if: ${{ env.CMS_EMAIL != '' && env.CMS_PASSWORD != '' }}
        run: node scripts/generate-auth-env.mjs

      - name: Build CMS
        run: npm run cms:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cms

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
